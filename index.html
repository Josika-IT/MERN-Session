<!DOCTYPE html>
<html>
<head>
    <title>Personal Detail Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff5f5;
        }

        h1 {
            color: #4a6fa5;
            text-align: center;
        }

        form {
            width: 600px;
            margin: auto;
            background-color: #fffdf5;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px #b8c6d9;
        }

        label {
            display: inline-block;
            width: 150px;
            margin: 10px;
            color: #34495e;
            font-weight: bold;
        }

        input, select, textarea {
            padding: 8px;
            margin: 5px;
            border: 1px solid #9bb7d4;
            border-radius: 6px;
        }

        textarea {
            width: 250px;
            height: 70px;
        }

        input:focus, select:focus, textarea:focus {
            border: 2px solid #6c8ebf;
            outline: none;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background-color: #6c8ebf;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #4a6fa5;
        }
    </style>
</head>

<body>

    <h1>Student Form</h1>

    <form>

        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br>

        <label>Password:</label>
        <input type="password" placeholder="Enter password">
        <br>

        <label>Phone Number:</label>
        <input type="tel" placeholder="Enter phone number">
        <br>

        <label>Parent Phone:</label>
        <input type="tel" placeholder="Enter parent phone">
        <br>

        <label>DOB:</label>
        <input type="date">
        <br>

        <label>Address:</label>
        <textarea placeholder="Enter your address"></textarea>
        <br>

        <label>Pincode:</label>
        <input type="number" placeholder="Enter pincode">
        <br>

        <label>Year of Study:</label>
        <select>
            <option>Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
        <br>

        <label>Courses:</label>
        <input type="number" placeholder="Number of courses">
        <br>

        <label>Bill Receipt:</label>
        <input type="file">
        <br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br>

        <label>Languages:</label>
        <input type="checkbox"> Java
        <input type="checkbox"> Python
        <input type="checkbox"> C
        <br>

        <label>Department:</label>
        <select>
            <option>Select Department</option>
            <option>IT</option>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
        </select>
        <br>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>
</html>
